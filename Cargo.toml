[package]
name = "rust-retail"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
name = "rust_retail"

[dependencies]
# --- CORE (2025-2026 Editions) ---
serde = { version = "1.0.210", features = ["derive"] }
ts-rs = { version = "10.0", features = ["serde-compat"] }
serde_json = "1.0.128"
thiserror = "2.0"
async-trait = "0.1.82"
log = "0.4"

# --- NETWORK ---
# Reqwest 0.12 usa Hyper 1.0, mucho más rápido y moderno
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "multipart",
  "stream"
] }

# --- ASYNC ---
tokio = { version = "1.49", features = ["rt", "sync"] }
uniffi = { version = "0.28.3", features = ["tokio", "cli"] }
wasm-bindgen = "0.2.93"
send_wrapper = { version = "0.6", features = ["futures"] }
once_cell = "1.21.3"
console_error_panic_hook = "0.1.7"

# --- WEB (WASM / Angular) ---
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.93"
wasm-bindgen-futures = "0.4.43"
serde-wasm-bindgen = "0.6.5"
web-sys = { version = "0.3.70", features = [
  "Window",
  "Storage",
  "console",
] }
wasm-logger = "0.2"

# --- NATIVO (Mobile / Desktop) ---
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Rusqlite se queda aquí para no romper el build de Angular
rusqlite = { version = "0.38.0", features = ["bundled"] }
credentials = "1.0.0-beta.1"

# Para Android (Logcat)
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"

# Para iOS (Apple Unified Logging / Xcode)
[target.'cfg(target_os = "ios")'.dependencies]
oslog = "0.2"

[dev-dependencies]
wiremock = "0.6"
# CAMBIO: No repitas la versión, solo añade las features extras para tests
tokio = { version = "1.49", features = ["full"] }

[build-dependencies]
# Asegúrate de que esto esté así para que build.rs funcione
uniffi = { version = "0.28.3", features = ["build"] }
