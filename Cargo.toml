[package]
name = "rust-retail"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# --- CORE (2025-2026 Editions) ---
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
thiserror = "2.0" # v2.0 es la nueva versión estándar para manejo de errores
once_cell = "1.19"
async-trait = "0.1.82"
uniffi = { version = "0.28", features = [
  "tokio",
] } # v0.28 es la actual para UniFFI

# --- NETWORK ---
# Reqwest 0.12 usa Hyper 1.0, mucho más rápido y moderno
reqwest = { version = "0.12", features = ["json"] }

# --- ASYNC ---
tokio = { version = "1.40", features = ["rt", "sync"] }
wasm-bindgen = "0.2.93"

# --- WEB (WASM / Angular) ---
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.93"
wasm-bindgen-futures = "0.4.43"
serde-wasm-bindgen = "0.6.5"
web-sys = { version = "0.3.70", features = ["Storage", "Window", "console"] }

# --- NATIVO (Mobile / Desktop) ---
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Rusqlite se queda aquí para no romper el build de Angular
rusqlite = { version = "0.32.0", features = ["bundled"] }


[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1.40", features = ["full"] }
